on:
  push:
    branches:
      - main
  release:
    types:
      - created
jobs:
  build:
    strategy:
      # Each operating system must report its own verdict: a failure on one
      # runner used to cancel the other two and hide their real result.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run linting
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Test (linux)
        run: xvfb-run -a npm test
        if: runner.os == 'Linux'
      - name: Test (not linux)
        run: npm test
        if: runner.os != 'Linux'

  # The publication waits for the whole matrix: a failure on one operating
  # system must keep the extension off the marketplace.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Publish
        run: npm run deploy
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
